[project]
name = "credit-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hphillips9", email = "harry.phillips9@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
credit-pipeline = "credit_pipeline:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
